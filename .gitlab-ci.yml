include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/reuse-lint.yml
      - /gitlab-templates/blocks/ci-linux-base.yml

.docker_build:
    needs: []
    image: storage.kde.org/vm-images/image-builder
    tags:
      - VM
      - amd64
    variables:
      CONTAINER_RUNTIME: podman
      IMAGE_NAME_PREFIX: ${CI_REGISTRY}/${CI_PROJECT_PATH}/
      IMAGE_TAG: latest
    script:
      - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      - make -C docker/ ${IMAGE_NAME}
      - podman push ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${IMAGE_TAG}

lint:
  extends:
    - .ci_linux_base
    - .suse_tumbleweed_qt6stable
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always
  variables:
    PYTHONPATH: $CI_PROJECT_DIR/_install/lib64/python3.13/site-packages
    LD_LIBRARY_PATH: $CI_PROJECT_DIR/_install/lib64
  script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - python3 -u ci-utilities/run-ci-build.py --project $CI_PROJECT_NAME --branch $CI_COMMIT_REF_NAME --platform Linux/Qt6/Shared --only-setup-environment
    - make init
    - export LD_PRELOAD=/lib64/libasan.so.8 ASAN_OPTIONS='detect_leaks=0:halt_on_error=0:abort_on_error=0:log_path=/tmp/asan.log'
    - make lint

nextcloud_image:
  extends: .docker_build
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
      - docker/nextcloud/*
  variables:
    IMAGE_NAME: nextcloud

nextcloud-push-notifications_image:
  extends: .docker_build
  stage: build
  rules:
    - changes:
      - docker/nextcloud/*
  variables:
    IMAGE_NAME: nextcloud-push-notifications

radicale_image:
  extends: .docker_build
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
      - docker/radicale/*
  variables:
    IMAGE_NAME: radicale

cyrus_image:
  extends: .docker_build
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
      - docker/cyrus/*
  variables:
    IMAGE_NAME: cyrus

dovecot_image:
  extends: .docker_build
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
      - docker/dovecot/*
  variables:
    IMAGE_NAME: dovecot

e2e_tests:
  extends:
    - .ci_linux_base
    - .suse_tumbleweed_qt6stable
  stage: test
  rules:
    - when: always
  variables:
    DOCKER_IMAGE_PREFIX: invent-registry.kde.org/pim/akonadi-e2e-tests/
    TESTCONTAINERS_RYUK_DISABLED: true
    QT_QPA_PLATFORM: offscreen
  script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - python3 -u ci-utilities/run-ci-build.py --project $CI_PROJECT_NAME --branch $CI_COMMIT_REF_NAME --platform Linux/Qt6/Shared --only-setup-environment
    - make init
    - export LD_PRELOAD=/lib64/libasan.so.8
    - export ASAN_OPTIONS='detect_leaks=0:halt_on_error=0:abort_on_error=0:log_path=/tmp/asan.log'
    - export PATH=$CI_PROJECT_DIR/_install/bin:$PATH
    - export LD_LIBRARY_PATH=$CI_PROJECT_DIR/_install/lib64
    - export XDG_DATA_DIRS=$CI_PROJECT_DIR/_install/share:$XDG_DATA_DIRS
    - export QT_PLUGIN_PATH=$CI_PROJECT_DIR/_install/lib64/plugins:$CI_PROJECT_DIR/_install/lib/plugins:$QT_PLUGIN_PATH
    - export PYTHONPATH=$CI_PROJECT_DIR/_install/lib64/python3.13/site-packages/
    - export DISPLAY=:90
    # The path to the binaries in the .service files are wrong because of a relocation issue during run-ci.py
    # So we have to replace it with the right path for services to start properly.
    - sed -i -e 's|/builds/[^ ]*/_install|$CI_PROJECT_DIR/_install|g' $CI_PROJECT_DIR/_install/share/dbus-1/services/*.service $CI_PROJECT_DIR/_install/lib/systemd/user/*.service
    - mkdir $XDG_DATA_HOME/kwalletd
    - cp ci/kdewallet.{kwl,salt} "$XDG_DATA_HOME/kwalletd/"
    - mkdir ~/.config/KDE
    - cp ci/kunifiedpush-distributor.conf ~/.config/KDE/kunifiedpush-distributor.conf
    - Xvfb -ac :90 >/tmp/xvfb.log 2>&1 &
    - eval "$(dbus-launch --sh-syntax)"
    # We have to launch the kwallet daemon manually, otherwise it won't register the wallet we injected in time for the tests
    - kwalletd6 >/tmp/kwallet.log 2>&1 &
    - make test
