[project]
name = "akonadi-e2e-tests"
version = "0.1.0"
description = "E2E tests for Akonadi Resources"
readme = "README.md"
requires-python = ">=3.13"
# Most of those dependencies would normally be in dev-dependencies, but since tests
# >are< the main usage of this package, we list them here.
dependencies = [
    "requests>=2.34.1",
    "caldav==3.1.0",
    "camel-converter>=5.1.0",
    "factory-boy>=3.3.3",
    "imap-tools>=1.14.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.1",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "sdbus>=0.14.2",
    "testcontainers>=4.15.0",
    "xdg-base-dirs>=6.0.2",
    "python-ntfy>=0.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
#addopts = "--dist loadscope"

[tool.mypy]
explicit_package_bases = true

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "redefined-outer-name",
]

[tool.ruff]
line-length = 100
output-format = "full"

[tool.ruff.lint]
select = ["E", "F", "I", "PERF", "ARG", "W", "UP", "B", "SIM"]
ignore = [
    "E1", # handled by formatter
    "E4", # handled by formatter
    "E5", # handled by formatter
    "PERF203", # Too many false positives
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 99

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest-mypy>=1.0.1",
    "pytest-ruff>=0.5",
    "ruff>=0.16.0",
    "types-psutil>=7.2.2",
    "types-icalendar>=6.3.2"
]
